name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rafaelvpolan/hii
          path: .hii-ref
          ref: c75362e859b1ecba080349e2fb95a4a93ca111e4 # estado, versao e admissao via API (hii#67)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile || bun install
      - run: bun run typecheck
      - run: bun run lint:types
      - run: bun run test:unit
        env:
          HICODE_CONTRATO_HII: '1'
          HII_HOME: ${{ github.workspace }}/.hii-ref
      - run: cd panel && bun install --frozen-lockfile || bun install
      - run: bun run typecheck:panel
      - run: cd .hii-ref && bun install --frozen-lockfile
      - run: node scripts/sincronizar-tecnico.mjs --check
        env:
          HII_TEST_CHECKOUT: ${{ github.workspace }}/.hii-ref
      - run: bunx playwright install --with-deps chromium
      - run: node scripts/test-hii-observabilidade.mjs
        env:
          HII_TEST_CHECKOUT: ${{ github.workspace }}/.hii-ref

      - run: bun run panel:build
      - run: node scripts/test-motor-status.mjs
